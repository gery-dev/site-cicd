# Workflow: проверка HTML и CSS, затем публикация сайта на GitHub Pages.
# Файл размещается в репозитории по пути: .github/workflows/deploy.yml
name: Deploy static site # название workflow (видно на вкладке Actions)

# Триггер: каждый push в main, а также ручной запуск кнопкой Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Права доступа, необходимые для публикации на GitHub Pages
permissions:
  contents: read # чтение файлов репозитория
  pages: write # разрешение на публикацию в Pages
  id-token: write # OIDC-токен для подтверждения деплоя

jobs:
  lint: # задание 1: автопроверка кода (линтинг)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Проверка HTML по правилам из файла .htmlhintrc
      - name: Lint HTML
        run: npx --yes htmlhint@1.1.4 index.html
      # Проверка CSS по правилам из файла .stylelintrc.json
      - name: Lint CSS
        run: npx --yes stylelint@16.10.0 "css/*.css"

  deploy: # задание 2: публикация, запускается только если lint прошёл
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
